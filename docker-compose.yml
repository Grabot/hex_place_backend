version: '3.6'

services:
  hex_api:
    container_name: hex_api
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - default
    ports:
      - 5000:5000
    restart: always
    volumes:
      - ${SHARED_DIR}:/static/uploads/
      - ./app/migrations:/app/migrations
    command: "/bin/sh boot.sh"
    depends_on:
      - hex_db
    links:
      - hex_db

  hex_db:
    container_name: hex_db
    env_file: .env
    image: postgres:18.1
    networks:
      - default
    ports:
      - 5432:5432
    restart: always
    shm_size: 1g
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "max_parallel_workers=32"
      - "-c"
      - "max_parallel_workers_per_gather=8"
      - "-c"
      - "shared_buffers=4096MB"

  redis:
    image: redis:7.0.10
    ports:
      - 6379:6379
    command:
      - redis-server

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - default
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${SHARED_DIR}:/static/uploads/
    depends_on:
      - redis
      - hex_db
    command: "celery -A app.celery_worker.tasks worker -l info"
