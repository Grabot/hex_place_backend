[project]
name = "hex_place"
version = "1.1.1"
description = "Hex place is the place you go when you want to play with the bestagons"
authors = [{ name = "Grabot" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.119.1,<0.120",
    "uvicorn>=0.38.0,<0.39",
    "python-dotenv==1.0.1",
    "psycopg2-binary>=2.9.11,<3",
    "sqlmodel>=0.0.27,<0.0.28",
    "alembic>=1.17.0,<2",
    "asyncpg>=0.31.0,<0.32",
    "passlib==1.7.4",
    "authlib==1.3.1",
    "oauthlib==3.2.2",
    "python-socketio>=5.14.2,<6",
    "websockets>=15.0.1,<16",
    "asyncio-redis>=0.16.0,<0.17",
    "redis>=7.0.0,<8",
    "pillow>=12.0.0,<13",
    "fastapi-pagination>=0.14.3,<0.15",
    "fastapi-mail==1.4.1",
    "celery>=5.5.3,<6",
    "apscheduler>=3.11.0,<4",
    "pydantic-settings>=2.11.0,<3",
    "requests>=2.32.5,<3",
    "pyjwt>=2.10.1,<3",
    "python-multipart>=0.0.20",
    "pytz>=2025.2",
    "boto3>=1.43.14,<2",
    "cryptography>=48.0.0,<49",
    "podman-compose>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100

[tool.mypy]
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
exclude = "_ignore"

[tool.hatch.build.targets.sdist]
include = ["app"]

[tool.hatch.build.targets.wheel]
include = ["app"]

[tool.coverage.run]
branch = true
parallel = true
omit = [
]

[tool.coverage.report]
fail_under = 100
precision = 0
show_missing = true
skip_covered = false
skip_empty = false
sort = "Cover"

[tool.pylint]
disable = [
    "W0511", # https://pylint.pycqa.org/en/latest/user_guide/messages/warning/fixme.html
    "C0411", # Conflicts with ruff's isort
    "W0613", # unused-argument, this is covered by Ruff ARG001
    "W0611", # unused-import, covered by Ruff F401
    "C0301", # line-too-long, covered by Ruff E501
    "W0718", # broad-exception-caught, covered by Ruff BLE001
    "W0719", # broad-exception-raised, covered by Ruff TRY002
    "W0212", # private member accessed, covered by Ruff SLF001
]
